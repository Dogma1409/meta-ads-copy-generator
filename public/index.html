<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meta Ads Copy Generator — WideStep demo</title>

  <!-- Google Fonts: Inter (only allowed CDN per hermes rules) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- Local stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Meta Ads Copy Generator</h1>
      <p class="subtitle">WideStep demo — generate variations, score them, export to Meta Ads API v20.</p>
    </header>

    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading">Product brief</h2>

      <form id="generate-form" novalidate>
        <div class="field">
          <label for="product_name">Product name</label>
          <input
            id="product_name"
            name="product_name"
            type="text"
            required
            autocomplete="off"
            placeholder="e.g. WideStep BareFlex Pro"
          />
        </div>

        <div class="field">
          <label for="product_description">Product description</label>
          <textarea
            id="product_description"
            name="product_description"
            rows="4"
            required
            placeholder="What it does, key features, price point…"
          ></textarea>
        </div>

        <div class="field">
          <label for="audience">Target audience</label>
          <textarea
            id="audience"
            name="audience"
            rows="3"
            required
            placeholder="Who it is for, pain points, desired outcome."
          ></textarea>
        </div>

        <div class="field">
          <label for="variations_count">Number of variations</label>
          <input
            id="variations_count"
            name="variations_count"
            type="number"
            min="1"
            max="10"
            step="1"
            value="3"
            required
          />
        </div>

        <button id="generate-btn" type="submit" class="btn-primary">
          Generate
        </button>
      </form>
    </section>

    <section class="results-section" aria-labelledby="results-heading">
      <h2 id="results-heading">Results</h2>
      <div id="error" class="error-box" hidden></div>
      <div id="results"></div>
    </section>
  </main>

  <!-- Scripts loaded in order; no defer/async on purpose (small, order-sensitive). -->
  <script src="js/form.js"></script>
  <script src="js/results.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
